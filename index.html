<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications — Turk-Browne Lab</title>
<meta name="description" content="PDFs of publications from the Turk-Browne Lab, Yale University.">
<style>
  :root {
    --ink: #14181d;
    --ink-soft: #5a626d;
    --ink-faint: #8b939e;
    --rule: #e3e6ea;
    --paper: #ffffff;
    --accent: #00356b;
    --accent-wash: #eef2f7;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 4rem 1.5rem 6rem;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 46rem; margin: 0 auto; }

  header { border-bottom: 1px solid var(--rule); padding-bottom: 1.75rem; }

  h1 {
    margin: 0 0 0.35rem;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .lede { margin: 0; color: var(--ink-soft); font-size: 0.9375rem; }
  .lede a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-wash); }
  .lede a:hover { border-bottom-color: var(--accent); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.75rem 1rem;
    margin-top: 1.5rem;
  }

  #filter {
    flex: 1 1 16rem;
    padding: 0.5rem 0.7rem;
    font: inherit;
    font-size: 0.9375rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  #filter::placeholder { color: var(--ink-faint); }
  #filter:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  #count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .group {
    display: grid;
    grid-template-columns: 4.5rem 1fr;
    gap: 0 1.5rem;
    padding: 1.75rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .group[hidden] { display: none; }

  .year {
    position: sticky;
    top: 1.25rem;
    align-self: start;
    margin: 0;
    font-family: var(--mono);
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    padding-top: 0.2rem;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.4rem 0; }
  li[hidden] { display: none; }

  li a {
    display: block;
    color: var(--ink);
    text-decoration: none;
    border-radius: 3px;
    padding: 0.15rem 0.4rem;
    margin-left: -0.4rem;
  }
  li a:hover, li a:focus-visible { background: var(--accent-wash); }
  li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

  .cite { font-size: 1rem; }
  .author { font-weight: 600; }
  .journal { color: var(--ink-soft); }

  .file {
    display: block;
    margin-top: 0.1rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
    word-break: break-all;
  }
  li a:hover .file { color: var(--accent); }

  .msg {
    margin: 2.5rem 0;
    padding: 1rem 1.15rem;
    background: var(--accent-wash);
    border-left: 2px solid var(--accent);
    font-size: 0.9375rem;
    color: var(--ink-soft);
  }
  .msg code { font-family: var(--mono); font-size: 0.8125em; }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8125rem;
    color: var(--ink-faint);
  }

  @media (max-width: 34rem) {
    body { padding-top: 2.5rem; }
    .group { grid-template-columns: 1fr; gap: 0.5rem; }
    .year { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Publications</h1>
    <p class="lede">
      PDFs from the Turk-Browne Lab. Full list with abstracts at
      <a href="https://ntblab.yale.edu">ntblab.yale.edu</a>.
    </p>
    <div class="controls">
      <label class="visually-hidden" for="filter">Filter publications</label>
      <input id="filter" type="search" placeholder="Filter by author, journal, or year" autocomplete="off">
      <span id="count" aria-live="polite"></span>
    </div>
  </header>

  <main id="list">
    <p class="msg" id="status">Loading…</p>
  </main>

  <footer>Files are named <code>Author_Journal_Year.pdf</code>.</footer>

</div>

<script>
// ---------------------------------------------------------------------------
// Edit these two lines if the repository moves.
const OWNER = "ntblab";
const REPO  = "publications";
const PATH  = "";          // subfolder inside the repo, e.g. "pdfs". Leave "" for root.
// ---------------------------------------------------------------------------

const listEl   = document.getElementById("list");
const statusEl = document.getElementById("status");
const filterEl = document.getElementById("filter");
const countEl  = document.getElementById("count");

// Author_Journal_Year.pdf — journal may itself contain underscores.
const NAME_RE = /^([^_]+)_(.+)_(\d{4})\.pdf$/i;

function parse(name) {
  const m = name.match(NAME_RE);
  if (!m) return { name, author: name.replace(/\.pdf$/i, ""), journal: "", year: null };
  return { name, author: m[1], journal: m[2].replace(/_/g, " "), year: parseInt(m[3], 10) };
}

function showMessage(html) {
  listEl.innerHTML = "";
  const p = document.createElement("p");
  p.className = "msg";
  p.innerHTML = html;
  listEl.appendChild(p);
}

function render(papers) {
  papers.sort((a, b) => {
    if (a.year !== b.year) {
      if (a.year === null) return 1;
      if (b.year === null) return -1;
      return b.year - a.year;
    }
    return a.author.localeCompare(b.author, "en", { sensitivity: "base" });
  });

  listEl.innerHTML = "";
  let currentYear = "__init__";
  let group, ul;

  for (const p of papers) {
    if (p.year !== currentYear) {
      currentYear = p.year;
      group = document.createElement("section");
      group.className = "group";

      const h2 = document.createElement("h2");
      h2.className = "year";
      h2.textContent = p.year === null ? "—" : p.year;

      ul = document.createElement("ul");
      group.append(h2, ul);
      listEl.appendChild(group);
    }

    const a = document.createElement("a");
    a.href = (PATH ? PATH + "/" : "./") + p.name;

    const cite = document.createElement("span");
    cite.className = "cite";

    const author = document.createElement("span");
    author.className = "author";
    author.textContent = p.author;
    cite.appendChild(author);

    if (p.journal) {
      const journal = document.createElement("span");
      journal.className = "journal";
      journal.textContent = ", " + p.journal;
      cite.appendChild(journal);
    }

    const file = document.createElement("span");
    file.className = "file";
    file.textContent = p.name;

    a.append(cite, file);

    const li = document.createElement("li");
    li.dataset.search = (p.author + " " + p.journal + " " + (p.year ?? "") + " " + p.name).toLowerCase();
    li.appendChild(a);
    ul.appendChild(li);
  }

  countEl.textContent = papers.length + (papers.length === 1 ? " paper" : " papers");
}

function applyFilter() {
  const q = filterEl.value.trim().toLowerCase();
  let visible = 0;

  for (const group of listEl.querySelectorAll(".group")) {
    let groupVisible = 0;
    for (const li of group.querySelectorAll("li")) {
      const match = !q || li.dataset.search.includes(q);
      li.hidden = !match;
      if (match) groupVisible++;
    }
    group.hidden = groupVisible === 0;
    visible += groupVisible;
  }

  countEl.textContent = visible + (visible === 1 ? " paper" : " papers") + (q ? " shown" : "");
}

filterEl.addEventListener("input", applyFilter);

const api = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + PATH;

fetch(api, { headers: { Accept: "application/vnd.github+json" } })
  .then(r => {
    if (r.status === 403) throw new Error("rate-limit");
    if (!r.ok) throw new Error("http-" + r.status);
    return r.json();
  })
  .then(items => {
    const papers = items
      .filter(i => i.type === "file" && /\.pdf$/i.test(i.name))
      .map(i => parse(i.name));

    if (!papers.length) {
      showMessage("No PDFs found in this folder yet.");
      return;
    }
    render(papers);
    if (filterEl.value) applyFilter();
  })
  .catch(err => {
    if (err.message === "rate-limit") {
      showMessage(
        "The file list is temporarily unavailable because this browser has made too many " +
        "requests to GitHub in the past hour. Try again shortly, or browse the files directly at " +
        '<a href="https://github.com/' + OWNER + "/" + REPO + '">github.com/' + OWNER + "/" + REPO + "</a>."
      );
    } else {
      showMessage(
        "Could not load the file list. Browse the files directly at " +
        '<a href="https://github.com/' + OWNER + "/" + REPO + '">github.com/' + OWNER + "/" + REPO + "</a>."
      );
    }
  });
</script>
</body>
</html>
